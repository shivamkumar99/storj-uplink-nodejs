# SonarQube project configuration for storj-uplink-nodejs.
#
# Run from this directory with an analysis token in the environment
# (never put the token in this file — it is committed to git):
#
#   npm run test:coverage && SONAR_TOKEN=<token> sonar-scanner
#
# Generate a token in SonarQube: My Account → Security → Generate Tokens.

sonar.projectKey=storj-uplink-nodejs
sonar.projectName=storj-uplink-nodejs
sonar.projectVersion=1.0.4

sonar.host.url=http://localhost:9000

# TypeScript binding + the C addon; never build output, vendored uplink-c, or deps.
sonar.sources=src,native/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.uplink-c-build/**,**/*.dSYM/**
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Tests and coverage (Jest → lcov). Run `npm run test:coverage` before scanning.
sonar.tests=test,native/test
sonar.test.inclusions=test/**/*.test.ts,native/test/**/*.c
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# test/integration and test/e2e register their cases only when Storj
# credentials are present (they run against a live satellite); Sonar sees
# "no tests in file" (S2187) when analysed without credentials. Not a defect.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=test/integration/**
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e2.resourceKey=test/e2e/**
