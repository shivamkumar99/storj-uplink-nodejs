# ==============================================================================
# Nightly Build - Scheduled Testing
# ==============================================================================
# Triggers: Daily at 2 AM UTC, manual dispatch
# Purpose: Extended tests, memory checks, and compatibility testing
# ==============================================================================

name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Extended Test Matrix
  # ============================================================================
  test-matrix:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false   # no go.mod here; uplink-c is built in its own clone

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: make install-source
        shell: bash

      - name: Run all tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
        continue-on-error: true
        env:
          STORJ_ACCESS_GRANT: ${{ secrets.STORJ_ACCESS_GRANT }}

  # ============================================================================
  # Memory Leak Testing (Linux only - Valgrind)
  # ============================================================================
  memory-tests:
    name: Memory Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false   # no go.mod here; uplink-c is built in its own clone

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # make install-source builds libuplink from the pinned uplink-c and puts
      # uplink.h under native/include; node-gyp cannot compile the addon without
      # it. Then rebuild the addon with debug symbols for Valgrind.
      - name: Build libuplink + addon
        run: make install-source VERBOSE=1
      - name: Rebuild addon with debug symbols
        run: |
          npm run build:ts
          CFLAGS="-g -O0" npm run build:native

      - name: Run memory tests
        run: npm run test:memory
        continue-on-error: true
        env:
          STORJ_ACCESS_GRANT: ${{ secrets.STORJ_ACCESS_GRANT }}

  # ============================================================================
  # Installation Methods Tests (Sprint 13)
  # ============================================================================
  install-methods:
    name: Installation Methods (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false   # no go.mod here; uplink-c is built in its own clone

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run installation methods tests
        run: npm run test:install
        shell: bash

  # ============================================================================
  # AddressSanitizer Build
  # ============================================================================
  asan-tests:
    name: AddressSanitizer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false   # no go.mod here; uplink-c is built in its own clone

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build with ASan
        run: |
          export CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g"
          export LDFLAGS="-fsanitize=address"
          make install-source VERBOSE=1
        continue-on-error: true

      - name: Run tests with ASan
        run: |
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          npm run test:unit
        continue-on-error: true

  # ============================================================================
  # Benchmark Tests
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false   # no go.mod here; uplink-c is built in its own clone

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: make install-source

      - name: Run benchmarks
        run: npm run benchmark
        continue-on-error: true

  # ============================================================================
  # Dependency Updates Check
  # ============================================================================
  dependency-check:
    name: Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for outdated packages
        run: |
          echo "## Outdated Dependencies" >> "$GITHUB_STEP_SUMMARY"
          npm outdated --json > outdated.json || true
          jq -r 'to_entries[] | "- \(.key): \(.value.current) → \(.value.latest)"' outdated.json >> "$GITHUB_STEP_SUMMARY" || echo "All dependencies up to date" >> "$GITHUB_STEP_SUMMARY"

      - name: Security audit
        run: |
          echo "## Security Audit" >> "$GITHUB_STEP_SUMMARY"
          npm audit --json > audit.json || true
          jq -r '.metadata.vulnerabilities | to_entries[] | select(.value > 0) | "\(.key): \(.value)"' audit.json >> "$GITHUB_STEP_SUMMARY" || echo "No vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Nightly Summary
  # ============================================================================
  summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [test-matrix, install-methods, memory-tests, asan-tests, benchmarks, dependency-check]
    if: always()
    steps:
      - name: Generate summary
        env:
          TEST_MATRIX: ${{ needs.test-matrix.result }}
          INSTALL_METHODS: ${{ needs.install-methods.result }}
          MEMORY: ${{ needs.memory-tests.result }}
          ASAN: ${{ needs.asan-tests.result }}
          BENCHMARKS: ${{ needs.benchmarks.result }}
          DEPS: ${{ needs.dependency-check.result }}
        run: |
          {
            echo "## Nightly Build Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Test Matrix | $TEST_MATRIX |"
            echo "| Install Methods | $INSTALL_METHODS |"
            echo "| Memory Tests | $MEMORY |"
            echo "| ASan Tests | $ASAN |"
            echo "| Benchmarks | $BENCHMARKS |"
            echo "| Dependency Check | $DEPS |"
          } >> "$GITHUB_STEP_SUMMARY"
