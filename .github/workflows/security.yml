# ==============================================================================
# Security Pipeline - Comprehensive Security Scanning
# ==============================================================================
# Triggers: Push to main, PRs to main, weekly schedule
# Purpose: Deep security analysis — SAST, dependency scan, secrets, binary integrity
#
# NOTE: Basic checks (lint, tsc, cppcheck, npm audit, gitleaks) are already
#       handled by ci.yml. This workflow runs ONLY the deeper/heavier tools.
# ==============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read

jobs:
  # ============================================================================
  # CodeQL Analysis (GitHub Advanced Security)
  # ============================================================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload CodeQL results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'c-cpp']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Setup Node.js (for C build)
        if: matrix.language == 'c-cpp'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Go (for C build)
        if: matrix.language == 'c-cpp'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Build for C analysis
        if: matrix.language == 'c-cpp'
        run: |
          npm ci --ignore-scripts
          make install-source SKIP_VERIFY=1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================================================
  # Semgrep SAST
  # ============================================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF
    container:
      # semgrep/semgrep is the current image name (returntocorp/semgrep is the legacy alias); digest-pinned
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --config=p/typescript \
            --config=p/nodejs \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --sarif --output=semgrep.sarif \
            --no-error
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
        if: always() && hashFiles('semgrep.sarif') != ''

  # ============================================================================
  # Dependency Scanning (Snyk — deeper than npm audit in CI)
  # ============================================================================
  dependency-scan:
    name: Dependency Security (Snyk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Snyk Security Scan
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          sarif_file: snyk.sarif
        if: always() && hashFiles('snyk.sarif') != ''

  # ============================================================================
  # License Compliance
  # ============================================================================
  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - run: npm ci --ignore-scripts

      - name: Check Licenses
        run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense;CC0-1.0"

  # ============================================================================
  # Secret Detection (TruffleHog — deeper than Gitleaks in CI)
  # ============================================================================
  secrets-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified
        continue-on-error: true

  # ============================================================================
  # Binary Integrity - ClamAV Scan + SHA256 Checksums
  # ============================================================================
  binary-integrity:
    name: Binary Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo freshclam || true

      - name: Scan prebuilt binaries with ClamAV
        run: |
          echo "## Binary Integrity Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d "native/prebuilds" ] && [ "$(find native/prebuilds -name '*.node' -o -name '*.so' -o -name '*.dylib' -o -name '*.dll' 2>/dev/null)" ]; then
            echo "Scanning prebuilt binaries..."
            clamscan --recursive --infected --no-summary native/prebuilds/ > clamav-report.txt 2>&1 || true

            if grep -q "FOUND" clamav-report.txt; then
              echo "| File | Status |" >> "$GITHUB_STEP_SUMMARY"
              echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
              grep "FOUND" clamav-report.txt | while read -r line; do
                echo "| $line | INFECTED |" >> "$GITHUB_STEP_SUMMARY"
              done
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "ClamAV detected infected files!"
              exit 1
            else
              echo "ClamAV: All binaries clean" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No prebuilt binaries found to scan" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate SHA256 checksums
        run: |
          {
            echo ""
            if [ -d "native/prebuilds" ] && [ "$(find native/prebuilds -type f 2>/dev/null)" ]; then
              echo "### SHA256 Checksums"
              echo '```'
              find native/prebuilds -type f \( -name '*.node' -o -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -exec sha256sum {} \; | tee checksums-sha256.txt
              echo '```'
            else
              echo "No binaries found for checksum generation"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integrity reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-integrity-report
          path: |
            clamav-report.txt
            checksums-sha256.txt
        if: always()

  # ============================================================================
  # Security Summary
  # ============================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, dependency-scan, licenses, secrets-scan, binary-integrity]
    if: always()
    steps:
      - name: Check security results
        env:
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SNYK: ${{ needs.dependency-scan.result }}
          LICENSES: ${{ needs.licenses.result }}
          TRUFFLEHOG: ${{ needs.secrets-scan.result }}
          BINARY: ${{ needs.binary-integrity.result }}
        run: |
          {
            echo "## Security Scan Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| CodeQL | $CODEQL |"
            echo "| Semgrep | $SEMGREP |"
            echo "| Snyk Dependencies | $SNYK |"
            echo "| Licenses | $LICENSES |"
            echo "| TruffleHog Secrets | $TRUFFLEHOG |"
            echo "| Binary Integrity | $BINARY |"
          } >> "$GITHUB_STEP_SUMMARY"
