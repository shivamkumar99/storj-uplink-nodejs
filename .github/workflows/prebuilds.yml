# ==============================================================================
# Build Prebuilds - Cross-Platform Binary Building
# ==============================================================================
# Triggers: Tags (v*), manual dispatch
# Purpose: Build prebuilt binaries for all platforms
# ==============================================================================

name: Build Prebuilds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      uplink_c_version:
        description: 'uplink-c version to build'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Must match UPLINK_C_VERSION in the Makefile (tag or full commit SHA).
  UPLINK_C_VERSION: ${{ github.event.inputs.uplink_c_version || 'fa48e8c862039e0fd8936d08f623bc898a6a579b' }}

jobs:
  # ============================================================================
  # Build Matrix - All Platforms
  # ============================================================================
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            arch: x64
          # - os: ubuntu-24.04-arm64
          #   platform: linux-arm64
          #   arch: arm64
          - os: macos-15
            platform: darwin-x64
            arch: x64
          - os: macos-15
            platform: darwin-arm64
            arch: arm64
          - os: windows-latest
            platform: win32-x64
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          package-manager-cache: false   # tag-triggered: never restore a cache written by other refs

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build from source
        run: make install-source VERBOSE=1 "UPLINK_C_VERSION=$UPLINK_C_VERSION" "PLATFORM=$PLATFORM"
        shell: bash
        env:
          npm_config_arch: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}

      - name: Verify build
        run: make verify-full "PLATFORM=$PLATFORM"
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Run tests
        if: matrix.arch == 'arm64' || runner.arch == 'X64'
        run: npm run test:unit
        continue-on-error: true

      - name: Create archive
        env:
          PLATFORM: ${{ matrix.platform }}
          REF_NAME: ${{ github.ref_name || 'dev' }}
        run: |
          cd "native/prebuilds/$PLATFORM"
          tar -czvf "../../../uplink-nodejs-$REF_NAME-$PLATFORM.tar.gz" ./*
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-${{ matrix.platform }}
          path: uplink-nodejs-*.tar.gz
          retention-days: 30

  # ============================================================================
  # Verify All Builds
  # ============================================================================
  verify:
    name: Verify Builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          {
            echo "## Built Artifacts"
            echo ""
            echo "| Platform | Size |"
            echo "|----------|------|"
            for f in artifacts/*.tar.gz; do
              size=$(du -h "$f" | cut -f1)
              name=$(basename "$f")
              echo "| $name | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: all-prebuilds
          path: artifacts/*.tar.gz
          retention-days: 90
