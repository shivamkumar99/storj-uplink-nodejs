# ==============================================================================
# CI Pipeline - Continuous Integration
# ==============================================================================
# Triggers: Every push, every PR
# Purpose: Fast feedback on code quality, tests, and basic security
# ==============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.25'

jobs:
  # ============================================================================
  # Workflow lint — syntax/expressions/shell (actionlint) + security (zizmor)
  # ============================================================================
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  # ============================================================================
  # Lint & Format Check
  # ============================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts
      
      - name: ESLint
        run: npm run lint
      
      - name: Prettier check
        run: npx prettier --check "src/**/*.ts"
      
      - name: TypeScript type check
        run: npx tsc --noEmit

  # ============================================================================
  # C Code Static Analysis
  # ============================================================================
  c-analysis:
    name: C Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false
      
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Download Node.js headers
        run: npx node-gyp install
      
      - name: Run cppcheck
        run: node scripts/cppcheck.js

  # ============================================================================
  # Build Matrix
  # ============================================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, c-analysis]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false   # no go.mod here; uplink-c is built in its own clone
      
      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build from source
        run: make install-source VERBOSE=1
        shell: bash
      
      - name: Verify build
        run: make verify-full
        shell: bash

      - name: Build TypeScript
        run: npm run build:ts

      - name: Verify runtime library resolution (foreign cwd, UPLINK_LIBRARY_PATH, relocated DLL)
        run: node scripts/verify-runtime-load.js
        shell: bash

      - name: Copy addon to prebuilds for cross-version testing
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}   # not PLATFORM: MSVC setup exports Platform=x64 on Windows and shadows it
        run: cp build/Release/uplink_native.node "native/prebuilds/$MATRIX_PLATFORM/"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.platform }}
          path: |
            native/prebuilds/${{ matrix.platform }}/
            native/include/
          retention-days: 7

  # ============================================================================
  # Test Matrix
  # ============================================================================
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.platform }}
          path: native/

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build native addon
        run: npm run build:native

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run C tests
        if: runner.os != 'Windows'
        run: npm run test:c
        shell: bash

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        continue-on-error: true
        env:
          STORJ_ACCESS_GRANT: ${{ secrets.STORJ_ACCESS_GRANT }}
      
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ============================================================================
  # Cross-Version Prebuild Compatibility
  # ============================================================================
  # Verifies that a .node addon built on one Node version loads on others.
  # The build job compiles on Node 20; this job tests loading WITHOUT
  # recompilation on Node 18 and 22 (prebuilt mode).
  # ============================================================================
  prebuild-compat:
    name: Prebuild Compat (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.platform }}
          path: native/

      - name: Verify artifact layout
        run: |
          echo "=== Artifact contents ==="
          find native/ -type f | head -20
          echo "=== Looking for .node file ==="
          find . -name 'uplink_native.node' -type f
          echo "=== Check .node rpath (Linux) ==="
          if command -v readelf &>/dev/null; then
            readelf -d native/prebuilds/*/uplink_native.node 2>/dev/null | grep -i 'rpath\|runpath\|needed' || echo "no rpath info"
          fi
          echo "=== Check .so presence ==="
          ls -la native/prebuilds/*/libuplink* 2>/dev/null || echo "no libuplink found"
        shell: bash

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build:ts

      - name: Verify prebuilt loads without recompilation
        run: |
          node -e "
            const m = require('./dist/native/index.js');
            console.log('Native module loaded successfully on Node', process.version);
            console.log('Platform:', process.platform + '-' + process.arch);
            console.log('Functions exported:', Object.keys(m.native || m.default || m).length);
          "
        shell: bash

      - name: Verify runtime library resolution (foreign cwd, UPLINK_LIBRARY_PATH, relocated DLL)
        run: node scripts/verify-runtime-load.js
        shell: bash

      - name: Run unit tests (prebuilt mode)
        run: npm run test:unit

  # ============================================================================
  # Install Persistence Test (.uplinkrc)
  # ============================================================================
  install-persistence:
    name: Install Persistence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false   # no go.mod here; uplink-c is built in its own clone

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.platform }}
          path: native/

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run install persistence tests
        run: npm run test:install
        shell: bash

  # ============================================================================
  # Prebuilt-archive install — the path every npm consumer takes
  #
  # Downloads the latest *published* release archive through the Makefile
  # (make install-prebuilt) on all three OSes and loads the addon. On Windows
  # this runs under Git Bash, whose GNU tar treats "C:/..." as a remote host —
  # the exact failure npm users hit before the Makefile switched to relative
  # paths. The nightly install-methods tests skip this case, so it lives here.
  # ============================================================================
  prebuilt-install:
    name: Prebuilt install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (no native build)
        run: npm ci --ignore-scripts

      - name: Install the latest published prebuilt archive via the Makefile
        shell: bash
        run: |
          latest=$(npm view storj-uplink-nodejs version)
          echo "latest published version: $latest"
          make install-prebuilt VERBOSE=1 "VERSION=$latest"

      - name: Load the prebuilt addon
        shell: bash
        run: |
          npm run build:ts
          node -e "const l = require('./dist'); console.log('loaded', typeof l.Uplink, process.platform + '-' + process.arch, JSON.stringify(l.uplinkCVersion()))"

      - name: Verify runtime library resolution (foreign cwd, UPLINK_LIBRARY_PATH, relocated DLL)
        run: node scripts/verify-runtime-load.js
        shell: bash

  # ============================================================================
  # Hybrid Install — released library + headers, addon compiled locally
  # ============================================================================
  hybrid-install:
    name: Hybrid install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b953e0fa06dcbd7fdc0c2a5b4ebd57ffe70 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies (no native build)
        run: npm ci --ignore-scripts

      - name: Hybrid install of the latest published archive
        # Downloads libuplink + headers from the release, compiles the addon here.
        shell: bash
        run: |
          latest=$(npm view storj-uplink-nodejs version)
          echo "latest published version: $latest"
          make install-hybrid VERBOSE=1 "VERSION=$latest"

      - name: Load the addon
        shell: bash
        run: |
          npm run build:ts
          node -e "const l = require('./dist'); console.log('loaded', typeof l.Uplink, process.platform + '-' + process.arch, JSON.stringify(l.uplinkCVersion()))"

      - name: Verify runtime library resolution (foreign cwd, UPLINK_LIBRARY_PATH, relocated DLL)
        run: node scripts/verify-runtime-load.js
        shell: bash

  # ============================================================================
  # All CI Passed Gate
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [workflow-lint, lint, c-analysis, build, test, prebuild-compat, install-persistence, prebuilt-install, hybrid-install]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: |
            workflow-lint=${{ needs.workflow-lint.result }}
            lint=${{ needs.lint.result }}
            c-analysis=${{ needs.c-analysis.result }}
            build=${{ needs.build.result }}
            test=${{ needs.test.result }}
            prebuild-compat=${{ needs.prebuild-compat.result }}
            install-persistence=${{ needs.install-persistence.result }}
            prebuilt-install=${{ needs.prebuilt-install.result }}
            hybrid-install=${{ needs.hybrid-install.result }}
        run: |
          failed=0
          while IFS='=' read -r job result; do
            [[ -z "$job" ]] && continue
            printf '%-22s %s\n' "$job" "$result"
            [[ "$result" == "success" ]] || failed=1
          done <<< "$RESULTS"
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
